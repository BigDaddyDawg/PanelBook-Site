<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="theme-color" content="#07090f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PanelBook">
  <title>PanelBook · Scan</title>
  <link rel="manifest" href="manifest.webmanifest?v=1">
  <link rel="icon" href="icon.svg?v=1" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg?v=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;600;700&family=Oswald:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="theme.css?v=1">
  <style>
    body { padding-bottom: env(safe-area-inset-bottom); }
    main.section { max-width: 720px; padding-top: 0.5rem; }

    .card {
      background: var(--glass);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 1rem;
      margin-bottom: 1rem;
      backdrop-filter: blur(14px);
      box-shadow: var(--shadow);
      animation: cardIn 0.55s var(--ease) both;
    }
    .card:nth-of-type(2) { animation-delay: 0.05s; }
    .card:nth-of-type(3) { animation-delay: 0.1s; }

    .camwrap {
      position: relative;
      background: #000;
      aspect-ratio: 3 / 4;
      overflow: hidden;
      border: 1px solid rgba(255, 210, 74, 0.28);
      border-radius: 12px;
      box-shadow: inset 0 0 40px rgba(255, 59, 47, 0.12);
    }
    video, #still { width: 100%; height: 100%; object-fit: cover; display: block; }
    #still { display: none; position: absolute; inset: 0; }
    .camwrap.using-photo video { visibility: hidden; }
    .camwrap.using-photo #still { display: block; }
    .camwrap.using-photo .reticle { display: none; }
    .reticle {
      position: absolute; inset: 12% 8%;
      border: 2px dashed rgba(255, 210, 74, 0.65);
      border-radius: 8px;
      pointer-events: none;
      box-shadow: 0 0 24px rgba(255, 210, 74, 0.15);
    }
    .reticle::after {
      content: "one comic · title + barcode in frame";
      position: absolute; left: 0; right: 0; bottom: -1.6rem;
      text-align: center; color: rgba(255, 232, 170, 0.9); font-size: 0.75rem;
      letter-spacing: 0.04em;
    }

    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      gap: 0.5rem;
      width: 100%;
      padding: 0.95rem 1rem;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--glass-strong);
      color: var(--ink);
      font-family: var(--font-display);
      font-size: 0.92rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      transition: transform 0.2s var(--ease), box-shadow 0.2s ease, border-color 0.2s ease;
    }
    .btn:hover:not(:disabled) {
      transform: translateY(-1px);
      border-color: rgba(255, 210, 74, 0.45);
    }
    .btn.accent {
      background: linear-gradient(135deg, var(--power-soft), var(--power) 45%, #e8a020);
      color: #1a1208;
      border-color: transparent;
      box-shadow: 0 10px 28px rgba(255, 210, 74, 0.25);
    }
    .btn.ghost {
      background: rgba(255, 255, 255, 0.04);
      color: var(--ink);
    }
    .btn:disabled { opacity: 0.45; }
    .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; margin-top: 0.75rem; }

    label {
      display: block;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin: 0.65rem 0 0.3rem;
      font-family: var(--font-display);
    }
    input {
      width: 100%;
      padding: 0.75rem 0.9rem;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.05);
      color: var(--ink);
      font: inherit;
      outline: none;
    }
    input:focus {
      border-color: rgba(255, 210, 74, 0.5);
      box-shadow: 0 0 0 3px rgba(255, 210, 74, 0.1);
    }
    input::placeholder { color: var(--muted); }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; }

    .status { font-size: 0.85rem; color: var(--muted); margin: 0.5rem 0 0; min-height: 1.2em; }
    .status.ok { color: var(--panel-cyan); }
    .status.warn { color: #ff8a80; }
    .match { font-size: 0.82rem; color: var(--muted); margin-top: 0.35rem; }
    .chips { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-top: 0.4rem; }
    .chip {
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.05);
      border-radius: 999px;
      padding: 0.3rem 0.65rem;
      font-size: 0.8rem;
      color: var(--ink);
      cursor: pointer;
      transition: border-color 0.15s ease, transform 0.15s ease;
    }
    .chip:hover {
      border-color: rgba(79, 212, 200, 0.55);
      transform: translateY(-1px);
    }

    .count {
      font-family: var(--font-brand);
      font-size: 1.7rem;
      letter-spacing: 0.03em;
      color: var(--power-soft);
    }
    .list { list-style: none; margin: 0.5rem 0 0; padding: 0; }
    .list li {
      display: flex; align-items: center; gap: 0.5rem;
      padding: 0.55rem 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      font-size: 0.9rem;
    }
    .list li .meta { flex: 1; min-width: 0; }
    .list li .meta small { color: var(--muted); display: block; }
    .list li button {
      border: none; background: none; color: #ff8a80;
      font-size: 1.1rem; cursor: pointer; padding: 0 0.3rem;
    }
    .raw {
      font-family: ui-monospace, monospace;
      font-size: 0.72rem;
      color: var(--muted);
      white-space: pre-wrap;
      word-break: break-word;
      margin-top: 0.4rem;
    }
  </style>
</head>
<body>
  <div class="sky" aria-hidden="true">
    <canvas id="energy"></canvas>
    <div class="bloom bloom-a"></div>
    <div class="bloom bloom-b"></div>
    <div class="bloom bloom-c"></div>
    <div class="halftone"></div>
    <div class="panel-grid"></div>
    <div class="vignette"></div>
  </div>

  <header class="page-header">
    <h1 class="brand-compact">PanelBook<small>·Scan</small></h1>
    <a class="back" href="index.html">← Collection</a>
  </header>
  <main class="section">
    <div class="card">
      <label for="quick">Quick type</label>
      <input id="quick" type="text" autocomplete="off" autocapitalize="off" spellcheck="false"
        placeholder="venom 241   or   venom 241-250" />
      <div class="btn-row" style="margin-top:0.65rem;">
        <button id="quickBtn" class="btn accent" type="button">Add</button>
        <button id="quickClear" class="btn ghost" type="button">Clear</button>
      </div>
      <p id="quickStatus" class="status">Type series + issue (or a range) and hit Add / Enter.</p>
    </div>

    <div class="card">
      <div class="camwrap" id="camwrap">
        <video id="video" playsinline muted></video>
        <img id="still" alt="Cover preview" />
        <div class="reticle"></div>
      </div>
      <button id="scanBtn" class="btn accent" type="button" disabled style="margin-top:2rem;">Start camera</button>
      <button id="uploadBtn" class="btn ghost" type="button" style="margin-top:0.6rem;">Use a photo instead</button>
      <input id="fileInput" type="file" accept="image/*" hidden />
      <p id="status" class="status">Optional: camera/photo if you want UPC help.</p>
      <p class="status" style="margin-top:0.35rem;">Only text is saved (series, issue, UPC) — never photos.</p>
    </div>

    <div class="card">
      <label for="series">Series</label>
      <input id="series" type="text" autocomplete="off" placeholder="e.g. Amazing Spider-Man" />
      <div id="suggest" class="chips"></div>
      <div id="matchNote" class="match"></div>

      <div class="grid2">
        <div>
          <label for="issue">Issue #</label>
          <input id="issue" type="text" inputmode="numeric" placeholder="e.g. 300" />
        </div>
        <div>
          <label for="year">Year</label>
          <input id="year" type="text" inputmode="numeric" placeholder="opt." />
        </div>
      </div>

      <label for="upc">UPC / barcode</label>
      <input id="upc" type="text" inputmode="numeric" placeholder="scanned automatically" />

      <label for="notes">Notes</label>
      <input id="notes" type="text" placeholder="opt. (variant, condition…)" />

      <div class="raw" id="raw"></div>

      <div class="btn-row">
        <button id="addBtn" class="btn" type="button">Add to list</button>
        <button id="clearBtn" class="btn ghost" type="button">Clear fields</button>
      </div>
    </div>

    <div class="card">
      <div style="display:flex;align-items:baseline;justify-content:space-between;">
        <span class="count"><span id="count">0</span> scanned</span>
        <button id="wipeBtn" class="btn ghost" type="button" style="width:auto;padding:0.45rem 0.85rem;font-size:0.75rem;">Empty list</button>
      </div>
      <ul id="list" class="list"></ul>
      <button id="pushBtn" class="btn accent" type="button" style="margin-top:0.75rem;">Push to master</button>
      <p id="pushStatus" class="status"></p>
      <div class="btn-row">
        <button id="exportBtn" class="btn" type="button">Export CSV</button>
        <button id="copyBtn" class="btn ghost" type="button">Copy text</button>
      </div>
    </div>
  </main>

  <script src="atmosphere.js?v=1"></script>
  <script src="pwa.js?v=1"></script>
  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script src="scan.js?v=3"></script>
</body>
</html>
