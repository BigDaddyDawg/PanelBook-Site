<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07090f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PanelBook">
  <title>What to buy · PanelBook</title>
  <link rel="manifest" href="manifest.webmanifest?v=1">
  <link rel="icon" href="icon.svg?v=1" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg?v=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;600;700&family=Oswald:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="theme.css?v=1">
  <style>
    :root {
      --accent: #ffd24a;
      --hole: #ff6b4a;
      --marked: #e8b84a;
      --after: #4fd4c8;
      --before: #8fd18a;
      --focus: #ffd24a;
      --panel: rgba(14, 18, 30, 0.72);
    }
    .page-top {
      max-width: 1100px; margin: 0 auto;
      padding: 1.75rem 1.25rem 0.5rem;
      animation: rise 0.8s var(--ease) both;
    }
    .page-top .brand-compact { font-size: clamp(2.4rem, 7vw, 3.8rem); }
    .page-top .tag { color: var(--muted); margin: 0.45rem 0 0; max-width: 40rem; }
    .page-top .back { display: inline-block; margin-top: 0.75rem; color: var(--muted); text-decoration: none; font-weight: 600; font-size: 0.9rem; }
    .page-top .back:hover { color: var(--power-soft); }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 0 1.25rem 3rem; }

    .mode {
      display: flex; gap: 0.5rem; flex-wrap: wrap; margin: 1rem 0 0.75rem;
    }
    .mode button {
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--ink);
      padding: 0.55rem 0.95rem;
      border-radius: 999px;
      font-family: var(--font-display);
      font-size: 0.85rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      cursor: pointer;
      backdrop-filter: blur(10px);
    }
    .mode button.on {
      background: linear-gradient(135deg, var(--power-soft), var(--power));
      color: #1a1208; border-color: transparent;
    }

    .explain {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 0.65rem; margin: 0.75rem 0 1rem;
    }
    .explain button {
      text-align: left; border: 1px solid var(--line); background: var(--panel);
      padding: 0.85rem 0.95rem; font: inherit; cursor: pointer; color: inherit;
      border-radius: var(--radius); backdrop-filter: blur(10px);
      transition: transform 0.15s ease, border-color 0.15s ease;
    }
    .explain button:hover { transform: translateY(-2px); border-color: rgba(255,210,74,0.4); }
    .explain button.on { border-color: currentColor; background: rgba(255,255,255,0.06); }
    .explain button[data-kind="hole"] { color: var(--hole); }
    .explain button[data-kind="marked"] { color: var(--marked); }
    .explain button[data-kind="after"] { color: var(--after); }
    .explain button[data-kind="before"] { color: var(--before); }
    .explain b {
      display: block; font-family: var(--font-brand);
      font-size: 1.55rem; letter-spacing: 0.03em; color: var(--ink);
    }
    .explain small { display: block; color: var(--muted); margin-top: 0.2rem; line-height: 1.3; }

    .toolbar {
      display: flex; flex-wrap: wrap; gap: 0.65rem; align-items: center; margin-bottom: 1rem;
    }
    .toolbar input, .toolbar select {
      padding: 0.7rem 0.85rem; border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--panel); color: var(--ink); font: inherit;
      backdrop-filter: blur(10px);
    }
    .toolbar input { flex: 1; min-width: 180px; }
    .toolbar .count {
      font-family: var(--font-brand); font-size: 1.35rem;
      letter-spacing: 0.03em; margin-left: auto; color: var(--power-soft);
    }
    .toolbar button.dl {
      border: 1px solid var(--line);
      background: linear-gradient(135deg, var(--power-soft), var(--power));
      color: #1a1208; border-radius: 999px;
      padding: 0.65rem 0.95rem;
      font-family: var(--font-display);
      font-size: 0.8rem; letter-spacing: 0.06em; text-transform: uppercase;
      cursor: pointer;
    }
    .toolbar button.dl#clear {
      background: var(--panel); color: var(--ink);
    }

    .layout {
      display: grid; grid-template-columns: minmax(240px, 340px) 1fr;
      gap: 1rem; align-items: start;
    }
    @media (max-width: 800px) { .layout { grid-template-columns: 1fr; } }

    .bars {
      background: var(--panel); border: 1px solid var(--line);
      border-radius: var(--radius); backdrop-filter: blur(12px);
      padding: 0.75rem; max-height: 70vh; overflow: auto;
    }
    .section-label {
      font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em;
      color: var(--focus); font-weight: 700; margin: 0.4rem 0 0.5rem;
      font-family: var(--font-display);
    }
    .section-label.other { color: var(--muted); margin-top: 1rem; }
    .bar-row {
      display: grid; grid-template-columns: 1fr auto; gap: 0.35rem;
      align-items: center; margin-bottom: 0.35rem; cursor: pointer;
      padding: 0.28rem 0.4rem; border: 1px solid transparent; border-radius: 8px;
    }
    .bar-row:hover, .bar-row.active {
      background: rgba(255,255,255,0.05); border-color: var(--line);
    }
    .bar-row.focus-row .bar-label::before {
      content: "★ "; color: var(--focus);
    }
    .bar-label {
      font-size: 0.82rem; font-weight: 600;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .bar-track {
      grid-column: 1 / -1; height: 8px; background: rgba(255,255,255,0.06);
      border-radius: 4px; overflow: hidden;
    }
    .bar-fill { height: 100%; background: var(--impact); transition: width 0.25s ease; }
    .bar-fill.focus-fill { background: linear-gradient(90deg, var(--power), var(--impact)); }
    .bar-n { font-variant-numeric: tabular-nums; font-size: 0.85rem; color: var(--muted); }

    .detail {
      background: var(--panel); border: 1px solid var(--line);
      border-radius: var(--radius); backdrop-filter: blur(12px);
      padding: 1rem 1.1rem 1.25rem; min-height: 320px;
    }
    .detail h2 {
      font-family: var(--font-brand); font-size: 2rem;
      letter-spacing: 0.03em; margin: 0 0 0.25rem; color: #f5f0e4;
    }
    .badge {
      display: inline-block; font-size: 0.72rem; text-transform: uppercase;
      letter-spacing: 0.06em; color: var(--focus); border: 1px solid rgba(255,210,74,0.35);
      padding: 0.15rem 0.45rem; margin-left: 0.4rem; vertical-align: middle;
      border-radius: 999px;
    }
    .detail .hint { color: var(--muted); margin: 0 0 1rem; font-size: 0.92rem; }
    .group { margin-bottom: 1.1rem; }
    .group h3 {
      margin: 0 0 0.45rem; font-size: 0.78rem; text-transform: uppercase;
      letter-spacing: 0.07em; color: var(--muted);
    }
    .year-block { margin-bottom: 1.25rem; }
    .year-head {
      font-family: var(--font-brand); font-size: 1.55rem;
      letter-spacing: 0.04em; margin: 0 0 0.55rem; color: var(--power-soft);
      border-bottom: 1px solid var(--line); padding-bottom: 0.25rem;
    }
    .chips { display: flex; flex-wrap: wrap; gap: 0.35rem; }
    .chip {
      border: 1px solid var(--line); background: rgba(255,255,255,0.05);
      border-radius: 8px;
      padding: 0.28rem 0.55rem; font-size: 0.88rem; font-variant-numeric: tabular-nums;
      color: var(--ink);
    }
    .chip.hole { border-color: rgba(255,107,74,0.5); }
    .chip.marked { border-color: rgba(232,184,74,0.5); }
    .chip.after { border-color: rgba(79,212,200,0.5); }
    .chip.before { border-color: rgba(143,209,138,0.5); }
    .chip .yrs { color: var(--muted); font-size: 0.75rem; margin-left: 0.25rem; }
    .empty { color: var(--muted); padding: 2rem 0; }
  </style>
</head>
<body>
  <div class="sky" aria-hidden="true">
    <canvas id="energy"></canvas>
    <div class="bloom bloom-a"></div>
    <div class="bloom bloom-b"></div>
    <div class="bloom bloom-c"></div>
    <div class="halftone"></div>
    <div class="panel-grid"></div>
    <div class="vignette"></div>
  </div>

  <header class="page-top">
    <h1 class="brand-compact">What to buy</h1>
    <p class="tag">Focus mode starts on the titles you actually collect hard (ASM, Miles, Venom…). Toggle kinds below, click a series bar to zoom.</p>
    <a class="back" href="index.html">← Collection</a>
  </header>

  <div class="wrap">
    <div class="mode" id="mode">
      <button type="button" data-mode="focus" class="on">Your focus</button>
      <button type="button" data-mode="all">Everything</button>
    </div>

    <div class="explain" id="kinds">
      <button type="button" data-kind="hole" class="on">
        <b id="n-hole">—</b> Holes
        <small>Skipped in a run you collect. Start here.</small>
      </button>
      <button type="button" data-kind="marked">
        <b id="n-marked">—</b> Can’t find
        <small>Spreadsheet Missing — check shelves first.</small>
      </button>
      <button type="button" data-kind="after">
        <b id="n-after">—</b> After
        <small>Later issues after you stopped.</small>
      </button>
      <button type="button" data-kind="before">
        <b id="n-before">—</b> Before
        <small>Earlier issues before you started.</small>
      </button>
    </div>

    <div class="toolbar">
      <input id="q" type="search" placeholder="Filter series…" autocomplete="off">
      <select id="yearFilter">
        <option value="">All years</option>
      </select>
      <select id="sort">
        <option value="focus">Focus first, then most missing</option>
        <option value="count">Most missing first</option>
        <option value="name">A–Z</option>
      </select>
      <button type="button" class="dl" id="clear" hidden>Clear series</button>
      <span class="count"><span id="showing">0</span> to buy</span>
      <button type="button" class="dl" id="download">Download CSV</button>
    </div>

    <div class="layout">
      <aside class="bars" id="bars"></aside>
      <section class="detail" id="detail">
        <p class="empty">Pick a series on the left.</p>
      </section>
    </div>
  </div>

  <script>
    const KIND_LABEL = {
      hole: "Hole (skipped)",
      marked: "Can't find",
      after: "After (finish later)",
      before: "Before (started late)",
    };

    const ALL = [{"series": "Secret Wars: Battleworld", "volume": "Secret Wars: Battleworld Vol 1", "issue": "2", "year": "2015", "kind": "hole"}, {"series": "Spider-Gwen", "volume": "Spider-Gwen Vol 2", "issue": "2", "year": "2015", "kind": "hole"}, {"series": "The Mighty Thor", "volume": "The Mighty Thor Vol 2", "issue": "10", "year": "2015", "kind": "hole"}, {"series": "Venom", "volume": "Venom Vol 6", "issue": "257", "year": "2025", "kind": "hole"}, {"series": "Web Warriors", "volume": "Web Warriors Vol 1", "issue": "2", "year": "2015", "kind": "hole"}];
    const FOCUS = new Set(["Amazing Spider-Man", "Superior Spider-Man", "Silk", "Miles Morales: Ultimate Spider-Man", "Venom", "Spider-Man 2099", "Spider-Gwen", "Avengers", "Spider-Man/Deadpool", "Spider-Man", "Thor"]);
    const FOCUS_SCORE = {"Amazing Spider-Man": 190.0, "Superior Spider-Man": 77.0, "Silk": 77.0, "Miles Morales: Ultimate Spider-Man": 75.0, "Venom": 75.0, "Spider-Man 2099": 65.0, "Spider-Gwen": 65.0, "Avengers": 60.0, "Spider-Man/Deadpool": 50.0, "Spider-Man": 47.0, "Thor": 45.0};

    let activeKinds = new Set(["hole"]);
    let selectedSeries = null;
    let mode = "focus";

    const $ = (id) => document.getElementById(id);
    const isFocus = (s) => FOCUS.has(s);

    function issueKey(i) {
      const n = parseFloat(i);
      return Number.isFinite(n) ? n : 99999;
    }

    function baseRows() {
      const q = $("q").value.trim().toLowerCase();
      const yf = $("yearFilter").value;
      return ALL.filter((row) => {
        if (!activeKinds.has(row.kind)) return false;
        if (mode === "focus" && !isFocus(row.series)) return false;
        if (q && !row.series.toLowerCase().includes(q)) return false;
        if (yf && String(row.year || "") !== yf) return false;
        return true;
      });
    }

    function fillYearFilter() {
      const q = $("q").value.trim().toLowerCase();
      const years = new Set();
      for (const r of ALL) {
        if (!activeKinds.has(r.kind)) continue;
        if (mode === "focus" && !isFocus(r.series)) continue;
        if (q && !r.series.toLowerCase().includes(q)) continue;
        if (r.year) years.add(String(r.year));
      }
      const cur = $("yearFilter").value;
      const opts = ['<option value="">All years</option>'].concat(
        [...years].sort().map((y) => `<option value="${y}">${y}</option>`)
      );
      $("yearFilter").innerHTML = opts.join("");
      if ([...years].includes(cur)) $("yearFilter").value = cur;
    }

    function bySeries(rows) {
      const map = new Map();
      for (const r of rows) {
        if (!map.has(r.series)) map.set(r.series, []);
        map.get(r.series).push(r);
      }
      let entries = [...map.entries()];
      const sort = $("sort").value;
      if (sort === "name") {
        entries.sort((a, b) => a[0].localeCompare(b[0]));
      } else if (sort === "count") {
        entries.sort((a, b) => b[1].length - a[1].length || a[0].localeCompare(b[0]));
      } else {
        entries.sort((a, b) => {
          const fa = isFocus(a[0]) ? 1 : 0;
          const fb = isFocus(b[0]) ? 1 : 0;
          if (fa !== fb) return fb - fa;
          const sa = FOCUS_SCORE[a[0]] || 0;
          const sb = FOCUS_SCORE[b[0]] || 0;
          if (sa !== sb) return sb - sa;
          return b[1].length - a[1].length || a[0].localeCompare(b[0]);
        });
      }
      return entries;
    }

    function updateKindCounts() {
      const q = $("q").value.trim().toLowerCase();
      const yf = $("yearFilter").value;
      for (const kind of ["hole", "marked", "after", "before"]) {
        const n = ALL.filter((r) => {
          if (r.kind !== kind) return false;
          if (mode === "focus" && !isFocus(r.series)) return false;
          if (q && !r.series.toLowerCase().includes(q)) return false;
          if (yf && String(r.year || "") !== yf) return false;
          return true;
        }).length;
        $(`n-${kind}`).textContent = n.toLocaleString();
      }
    }

    function renderBars() {
      const rows = baseRows();
      const entries = bySeries(rows);
      const max = Math.max(1, ...entries.map(([, list]) => list.length));
      $("showing").textContent = rows.length.toLocaleString();
      $("clear").hidden = !selectedSeries;

      const focusEntries = entries.filter(([s]) => isFocus(s));
      const otherEntries = entries.filter(([s]) => !isFocus(s));

      function renderGroup(list, focusFill) {
        return list
          .map(([series, items]) => {
            const pct = Math.max(4, (items.length / max) * 100);
            const active = series === selectedSeries ? " active" : "";
            const fr = isFocus(series) ? " focus-row" : "";
            const fill = focusFill || isFocus(series) ? " focus-fill" : "";
            return `<div class="bar-row${active}${fr}" data-series="${escapeAttr(series)}">
              <div class="bar-label" title="${escapeAttr(series)}">${escapeHtml(series)}</div>
              <div class="bar-n">${items.length}</div>
              <div class="bar-track"><div class="bar-fill${fill}" style="width:${pct}%"></div></div>
            </div>`;
          })
          .join("");
      }

      let html = "";
      if (mode === "focus") {
        html = `<div class="section-label">Your focus · ${focusEntries.length} series</div>` +
          (renderGroup(focusEntries, true) || `<p class="empty">No focus gaps for these kinds.</p>`);
      } else {
        html =
          (focusEntries.length
            ? `<div class="section-label">Your focus</div>${renderGroup(focusEntries, true)}`
            : "") +
          (otherEntries.length
            ? `<div class="section-label other">Everything else</div>${renderGroup(otherEntries, false)}`
            : "") ||
          `<p class="empty">Nothing matches.</p>`;
      }
      $("bars").innerHTML = html;

      if (!selectedSeries && entries.length) {
        renderDetail(entries[0][0], entries[0][1]);
      } else if (selectedSeries) {
        const hit = entries.find(([s]) => s === selectedSeries);
        renderDetail(selectedSeries, hit ? hit[1] : []);
      }
    }

    function renderDetail(series, list) {
      const badge = isFocus(series) ? `<span class="badge">Focus</span>` : "";
      if (!list.length) {
        $("detail").innerHTML = `<h2>${escapeHtml(series)}${badge}</h2><p class="empty">No issues for the kinds you’ve turned on.</p>`;
        return;
      }

      // Group by publication year, then by kind
      const byYear = new Map();
      for (const r of list) {
        const y = String(r.year || "Unknown");
        if (!byYear.has(y)) byYear.set(y, []);
        byYear.get(y).push(r);
      }
      const yearKeys = [...byYear.keys()].sort((a, b) => {
        const na = parseInt(a, 10);
        const nb = parseInt(b, 10);
        if (Number.isFinite(na) && Number.isFinite(nb)) return na - nb;
        if (Number.isFinite(na)) return -1;
        if (Number.isFinite(nb)) return 1;
        return a.localeCompare(b);
      });

      const blocks = yearKeys
        .map((y) => {
          const rows = byYear.get(y);
          const byKind = {};
          for (const r of rows) (byKind[r.kind] ||= []).push(r);
          const kindBlocks = ["hole", "marked", "after", "before"]
            .filter((k) => byKind[k])
            .map((kind) => {
              const issues = byKind[kind]
                .slice()
                .sort(
                  (a, b) =>
                    String(a.volume || "").localeCompare(String(b.volume || "")) ||
                    issueKey(a.issue) - issueKey(b.issue)
                );
              const chips = issues
                .map(
                  (r) =>
                    `<span class="chip ${r.kind}" title="${escapeAttr(r.volume || "")}">#${escapeHtml(
                      r.issue
                    )}${r.volume ? `<span class="yrs">${escapeHtml(r.volume)}</span>` : ""}</span>`
                )
                .join("");
              return `<div class="group"><h3>${KIND_LABEL[kind]} · ${issues.length}</h3><div class="chips">${chips}</div></div>`;
            })
            .join("");
          return `<div class="year-block"><h3 class="year-head">${escapeHtml(y)} · ${rows.length}</h3>${kindBlocks}</div>`;
        })
        .join("");

      $("detail").innerHTML = `
        <h2>${escapeHtml(series)}${badge}</h2>
        <p class="hint">${list.length} issue${list.length === 1 ? "" : "s"} · grouped by publication year</p>
        ${blocks}`;
    }

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }
    function escapeAttr(s) {
      return escapeHtml(s).replace(/'/g, "&#39;");
    }

    function downloadCsv() {
      const rows = baseRows().filter((r) => !selectedSeries || r.series === selectedSeries);
      const header = ["series", "volume", "issue", "year", "kind", "focus"];
      const lines = [header.join(",")];
      for (const r of rows) {
        const row = { ...r, focus: isFocus(r.series) ? "yes" : "no" };
        lines.push(header.map((k) => `"${String(row[k] ?? "").replace(/"/g, '""')}"`).join(","));
      }
      const blob = new Blob([lines.join("\n")], { type: "text/csv" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = mode === "focus" ? "panelbook_focus_buy_list.csv" : "panelbook_buy_list.csv";
      a.click();
      URL.revokeObjectURL(a.href);
    }

    $("mode").addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-mode]");
      if (!btn) return;
      mode = btn.dataset.mode;
      for (const b of $("mode").querySelectorAll("button")) b.classList.toggle("on", b === btn);
      selectedSeries = null;
      fillYearFilter();
      updateKindCounts();
      renderBars();
    });

    $("kinds").addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-kind]");
      if (!btn) return;
      const kind = btn.dataset.kind;
      if (activeKinds.has(kind)) {
        if (activeKinds.size === 1) return;
        activeKinds.delete(kind);
        btn.classList.remove("on");
      } else {
        activeKinds.add(kind);
        btn.classList.add("on");
      }
      fillYearFilter();
      updateKindCounts();
      renderBars();
    });

    $("bars").addEventListener("click", (e) => {
      const row = e.target.closest(".bar-row");
      if (!row) return;
      selectedSeries = row.dataset.series;
      renderBars();
    });

    $("clear").addEventListener("click", () => {
      selectedSeries = null;
      renderBars();
    });
    $("q").addEventListener("input", () => {
      fillYearFilter();
      updateKindCounts();
      renderBars();
    });
    $("yearFilter").addEventListener("change", () => {
      updateKindCounts();
      renderBars();
    });
    $("sort").addEventListener("change", renderBars);
    $("download").addEventListener("click", downloadCsv);

    fillYearFilter();
    updateKindCounts();
    renderBars();
  </script>
  <script src="atmosphere.js?v=1"></script>
  <script src="pwa.js?v=1"></script>
</body>
</html>
