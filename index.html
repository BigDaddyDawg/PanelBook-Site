<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="theme-color" content="#07090f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link rel="manifest" href="manifest.webmanifest?v=1">
  <link rel="icon" href="icon.svg?v=1" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg?v=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;600;700&family=Oswald:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="theme.css?v=1">
</head>
<body>
  <div class="sky" aria-hidden="true">
    <canvas id="energy"></canvas>
    <div class="bloom bloom-a"></div>
    <div class="bloom bloom-b"></div>
    <div class="bloom bloom-c"></div>
    <div class="halftone"></div>
    <div class="panel-grid"></div>
    <div class="vignette"></div>
  </div>

  <section class="hero">
    <div class="hero-glow" aria-hidden="true"></div>
    <div class="hero-slash" aria-hidden="true"></div>
    <div class="hero-inner">
      <p class="eyebrow">Marvel collection vault</p>
      <h1 class="brand">PanelBook</h1>
      <p class="tagline">Your runs. Your gaps. Your shelves — in one kinetic ledger.</p>
      <div class="cta-row">
        <a class="cta cta-primary" href="#collection">Open the vault</a>
        <a class="cta cta-ghost" href="scan.html">Scan a comic →</a>
      </div>
    </div>
  </section>

  <div class="stats" id="stats"></div>

  <main class="section" id="collection">
    <p class="section-kicker">The collection</p>
    <h2 class="section-title">Publishing lines</h2>
    <p class="snap-tag" id="snapTag">Loading collection…</p>
    <p style="margin:0.85rem 0 1.1rem;">
      <a class="cta cta-ghost" href="buy.html" style="padding:0.65rem 1.05rem;font-size:0.85rem;">What to buy</a>
    </p>
    <input id="q" class="search" type="search" placeholder="Filter franchise, series or issue…" />
    <div id="out" class="err">Loading collection.json…</div>
  </main>

  <script src="atmosphere.js?v=1"></script>
  <script src="pwa.js?v=1"></script>
  <script>
    /* --- fuzzy series grouping --- */
    function normSeries(s) {
      return String(s || "").toLowerCase()
        .replace(/^the\s+/, "")
        .replace(/spider-man/g, "spiderman")
        .replace(/spider man/g, "spiderman")
        .replace(/&/g, " and ")
        .replace(/[^a-z0-9]+/g, " ")
        .replace(/\s+/g, " ")
        .trim();
    }

    function bigrams(s) {
      const t = s.replace(/\s+/g, "");
      const g = new Set();
      for (let i = 0; i < t.length - 1; i++) g.add(t.slice(i, i + 2));
      return g;
    }

    function dice(a, b) {
      const ga = bigrams(a), gb = bigrams(b);
      if (!ga.size || !gb.size) return 0;
      let inter = 0;
      for (const x of gb) if (ga.has(x)) inter++;
      return (2 * inter) / (ga.size + gb.size);
    }

    const FUZZY = 0.88;

    function clusterSeries(names) {
      const unique = [...new Set(names.filter(Boolean))];
      const norms = unique.map((n) => ({ name: n, norm: normSeries(n) }));
      const parent = norms.map((_, i) => i);
      const find = (i) => { while (parent[i] !== i) { parent[i] = parent[parent[i]]; i = parent[i]; } return i; };
      const unite = (a, b) => { parent[find(a)] = find(b); };

      for (let i = 0; i < norms.length; i++) {
        for (let j = i + 1; j < norms.length; j++) {
          if (norms[i].norm === norms[j].norm) { unite(i, j); continue; }
          if (dice(norms[i].norm, norms[j].norm) >= FUZZY) unite(i, j);
        }
      }

      const clusters = new Map();
      for (let i = 0; i < norms.length; i++) {
        const root = find(i);
        if (!clusters.has(root)) clusters.set(root, []);
        clusters.get(root).push(norms[i].name);
      }
      return [...clusters.values()];
    }

    function pickDisplayName(names) {
      const counts = new Map();
      for (const n of names) counts.set(n, (counts.get(n) || 0) + 1);
      return [...names].sort((a, b) => {
        const dc = (counts.get(b) || 0) - (counts.get(a) || 0);
        if (dc) return dc;
        const aThe = /^the\s/i.test(a), bThe = /^the\s/i.test(b);
        if (aThe !== bThe) return aThe ? 1 : -1;
        return a.localeCompare(b);
      })[0];
    }

    function issueNum(v) {
      const n = parseFloat(v);
      return Number.isFinite(n) ? n : 999999;
    }

    function detectPublishingLine(series) {
      const s = String(series || "").toLowerCase();

      if (/star wars/.test(s)) return "Star Wars";
      if (/^ultimate|^ultimates\b|^ultimate comics|ultimate universe|ultimate spider-man|ultimate wolverine|ultimate endgame|ultimate invasion|miles morales: the ultimate/.test(s)) {
        return "Ultimate Universe";
      }
      if (/spider-man|spider man|spider-verse|spider geddon|spider-geddon|spider force|spider gwen|spider-woman|scarlet spider|miles morales|friendly neighborhood|spectacular spider|amazing spider|non-stop spider|spidergeddon|edge of spider|symbiote spider|vault of spiders|spider-men|superior spider|spider-woman|king in black: spider-man|venom war: spider-man/.test(s)) {
        return "Spider-Man";
      }
      if (/^web of venom|venom war|^venom:|^all[- ]new venom|^venom$/.test(s) || (/\bvenom\b/.test(s) && !/amazing spider-man\/venom|spider-man\/venom/.test(s))) {
        return "Venom";
      }
      if (/iron man|ironheart|invincible iron|superior iron|infamous iron|international iron|tony stark/.test(s)) return "Iron Man";
      if (/avengers/.test(s)) return "Avengers";
      if (/captain america/.test(s)) return "Captain America";
      if (/fantastic four/.test(s)) return "Fantastic Four";
      if (/wolverine|x-men|x men|x-23|uncanny x/.test(s)) return "X-Men";
      if (/deadpool/.test(s)) return "Deadpool";
      if (/\bthor\b/.test(s)) return "Thor";
      if (/^the incredible hulk|^immortal hulk|\bhulk\b/.test(s)) return "Hulk";
      if (/daredevil/.test(s)) return "Daredevil";
      if (/guardians of the galaxy/.test(s)) return "Guardians of the Galaxy";
      if (/doctor strange|dr\. strange/.test(s)) return "Doctor Strange";
      if (/black panther/.test(s)) return "Black Panther";
      if (/absolute carnage|king in black|empyre|secret wars|civil war|war of the realms|dark ages|\binfinity\b/.test(s)) return "Events";

      const prefix = String(series || "").split(":")[0].trim();
      return prefix || series || "(unknown)";
    }

    function buildSeriesGroups(rows) {
      const bySeries = new Map();
      for (const r of rows) {
        const s = String(r.series || "").trim() || "(unknown)";
        if (!bySeries.has(s)) bySeries.set(s, []);
        bySeries.get(s).push(r);
      }
      return clusterSeries([...bySeries.keys()]).map((names) => {
        const issues = names.flatMap((n) => bySeries.get(n) || []);
        issues.sort((a, b) => issueNum(a.issue_number) - issueNum(b.issue_number));
        const display = pickDisplayName(names);
        const aliases = names.length > 1 ? names.filter((n) => n !== display) : [];
        const value = issues.reduce((sum, r) => sum + Number(r.estimated_value || 0), 0);
        const publishingLine = detectPublishingLine(display);
        return { display, names, aliases, issues, value, publishingLine };
      });
    }

    function buildLineGroups(seriesGroups) {
      const lines = new Map();
      for (const sg of seriesGroups) {
        const key = sg.publishingLine;
        if (!lines.has(key)) lines.set(key, { name: key, series: [], value: 0, issueCount: 0 });
        const line = lines.get(key);
        line.series.push(sg);
        line.value += sg.value;
        line.issueCount += sg.issues.length;
      }
      return [...lines.values()]
        .map((line) => {
          line.series.sort((a, b) => a.display.localeCompare(b.display));
          return line;
        })
        .sort((a, b) => a.name.localeCompare(b.name));
    }

    function esc(s) {
      return String(s ?? "").replace(/[&<>"']/g, (c) =>
        ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    function issueMatches(r, qq) {
      return String(r.title || "").toLowerCase().includes(qq) ||
        String(r.series || "").toLowerCase().includes(qq) ||
        String(r.issue_number ?? "").includes(qq);
    }

    function filterLines(lines, qq) {
      if (!qq) return lines;
      return lines.map((line) => {
        if (line.name.toLowerCase().includes(qq)) return line;
        const series = line.series.map((sg) => {
          if (sg.display.toLowerCase().includes(qq) || sg.names.some((n) => n.toLowerCase().includes(qq))) return sg;
          const issues = sg.issues.filter((r) => issueMatches(r, qq));
          return issues.length ? { ...sg, issues } : null;
        }).filter(Boolean);
        return series.length ? { ...line, series, issueCount: series.reduce((s, g) => s + g.issues.length, 0), value: series.reduce((s, g) => s + g.value, 0) } : null;
      }).filter(Boolean);
    }

    function renderIssueTable(issues) {
      return `<table>
        <thead><tr><th>#</th><th>Year</th><th>Est.</th><th>Source</th></tr></thead>
        <tbody>${issues.map((r) => `<tr>
          <td>${esc(r.issue_number ?? "")}</td>
          <td>${esc(r.year ?? "")}</td>
          <td class="money">£${Number(r.estimated_value || 0).toFixed(2)}</td>
          <td>${esc(r.market_source || "")}</td>
        </tr>`).join("")}</tbody>
      </table>`;
    }

    async function boot() {
      const out = document.getElementById("out");
      const stats = document.getElementById("stats");
      try {
        const res = await fetch(`collection.json?t=${Date.now()}`, { cache: "no-store" });
        if (!res.ok) throw new Error("No collection.json yet — run scripts/export_static.py");
        const data = await res.json();
        const when = data.exported_at
          ? new Date(data.exported_at).toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" })
          : "unknown";
        document.getElementById("snapTag").textContent =
          `Snapshot ${when} · ${(data.totals?.issues || 0).toLocaleString()} comics · grouped by publishing line`;
        const t = data.totals || {};
        stats.innerHTML = `
          <div class="stat"><b>${(t.issues || 0).toLocaleString()}</b><span>comics</span></div>
          <div class="stat"><b>£${Number(t.estimated_value_gbp || 0).toLocaleString()}</b><span>est. value</span></div>
          <div class="stat"><b>£${Number(t.paid_known_gbp || 0).toLocaleString()}</b><span>paid (known)</span></div>
        `;
        const rows = (data.collection || []).filter((r) => (r.kind || "comic") === "comic");
        const allLines = buildLineGroups(buildSeriesGroups(rows));

        const render = (q) => {
          const qq = (q || "").toLowerCase();
          const lines = filterLines(allLines, qq);

          if (!lines.length) {
            out.innerHTML = '<p class="empty">No comics match that search.</p>';
            return;
          }

          const seriesCount = lines.reduce((s, c) => s + c.series.length, 0);
          const issueCount = lines.reduce((s, c) => s + c.issueCount, 0);

          out.innerHTML = `<div class="groups">${lines.map((line, i) => {
            const seriesHtml = line.series.map((sg) => {
              const alias = sg.aliases.length
                ? `<span class="alias">Also: ${sg.aliases.map(esc).join(", ")}</span>`
                : "";
              return `<details class="group series">
                <summary>
                  <span class="group-name">${esc(sg.display)}${alias}</span>
                  <span class="group-meta"><b>${sg.issues.length}</b> · £${sg.value.toFixed(0)}</span>
                </summary>
                <div class="group-body">${renderIssueTable(sg.issues)}</div>
              </details>`;
            }).join("");
            return `<details class="group line" style="animation-delay:${Math.min(i, 12) * 28}ms">
              <summary>
                <span class="group-name">${esc(line.name)}</span>
                <span class="group-meta"><b>${line.series.length}</b> titles · <b>${line.issueCount}</b> issues · £${line.value.toFixed(0)}</span>
              </summary>
              <div class="group-body">${seriesHtml}</div>
            </details>`;
          }).join("")}</div>
          <p class="tag">${lines.length} franchises · ${seriesCount} series · ${issueCount} issues shown</p>`;
        };

        document.getElementById("q").addEventListener("input", (e) => render(e.target.value));
        render("");
      } catch (e) {
        out.textContent = e.message || String(e);
      }
    }
    boot();
  </script>
</body>
</html>
